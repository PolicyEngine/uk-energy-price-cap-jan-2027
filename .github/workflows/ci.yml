name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job names are the required check names a main ruleset would list:
# Python tests, Python lint, Frontend build, Frontend lint, Frontend tests.
jobs:
  python-test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
      - name: Install (core and dev only; no model, no microdata; lockfile must be current)
        run: uv sync --locked --extra dev
      - name: Tests (the engine tests skip without the model extra)
        run: uv run pytest
      - name: Placeholder results and manifest are reproducible
        run: |
          uv run uk-energy-price-cap generate
          git diff --exit-code dashboard/public/data/
      - name: Results file and manifest
        run: uv run uk-energy-price-cap validate
      - name: Public data check
        run: uv run python scripts/check_public_data.py
      - name: No drill packet file is tracked (drill branches)
        run: uv run python scripts/check_packet_not_committed.py

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Serve the build and check every tab, data file and noindex
        run: |
          bun run start -p 4871 > next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            curl --silent --output /dev/null http://127.0.0.1:4871/uk/energy-price-cap-jan-2027 && break
            sleep 1
          done
          ../scripts/smoke-built-site.sh http://127.0.0.1:4871/uk/energy-price-cap-jan-2027 \
            || { cat next-start.log; exit 1; }

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-public

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test
