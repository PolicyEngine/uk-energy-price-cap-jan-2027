name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (core and dev only; no model, no microdata)
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: Placeholder results are reproducible
        run: |
          uv run uk-energy-price-cap generate
          git diff --exit-code dashboard/public/data/results.json
      - name: Public data check
        run: uv run python scripts/check_public_data.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run check-public
