[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uk_energy_price_cap"
version = "0.1.0"
description = "Data pipeline and household calculator for the January to March 2027 energy price cap dashboard"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "PolicyEngine", email = "hello@policyengine.org" }]
# The core package (registry, limits, cap scenarios, household calculator,
# placeholder results, public data checks) is pure Python, so the tests run
# without microdata or the model.
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# The engine for real runs. policyengine 6.17.2 pins policyengine-uk 2.174.1
# (which has the Household Energy Payment and the energy price indices, from
# 2.170.2) and policyengine-core 3.33.3, and certifies Microcosm build
# microcosm-uk-2024-25-national-20261107T020434Z-eeb6093e. The model run
# still loads the frozen dataset file directly (unmanaged) and labels every
# figure "unvalidated under this engine" (issue #1).
model = [
    "policyengine[uk]==6.17.2",
    "numpy>=1.24.0",
    "h5py>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
uk-energy-price-cap = "uk_energy_price_cap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uk_energy_price_cap = ["years.json", "cap_levels.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
