[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uk_energy_price_cap"
version = "0.1.0"
description = "Data pipeline and household calculator for the January to March 2027 energy price cap dashboard"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "PolicyEngine", email = "hello@policyengine.org" }]
# The core package (registry, limits, cap scenarios, household calculator,
# placeholder results, public data checks) is pure Python, so the tests run
# without microdata or the model.
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# The engine for real runs: the policyengine-uk and policyengine-core
# versions Microcosm build uk-frs-calibration-attempt-20261112T133744Z-6f918b81
# was built and certified on (src/uk_energy_price_cap/data_build.py). No
# policyengine.py release pins this pair, so the model run loads
# policyengine_uk and the dataset file directly (it never imported
# policyengine.py) and labels every figure "build ..., policyengine-uk
# 2.177.7, not in a policyengine.py release" (issue #1). Keep these two pins
# equal to DATA_BUILD.engine and DATA_BUILD.core; the run refuses any other.
model = [
    "policyengine-uk==2.177.7",
    "policyengine-core==3.34.10",
    "numpy>=1.24.0",
    "h5py>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    # tests/test_household_kwh.py writes a small Microcosm-shaped file.
    "h5py>=3.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
uk-energy-price-cap = "uk_energy_price_cap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uk_energy_price_cap = ["years.json", "cap_levels.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
